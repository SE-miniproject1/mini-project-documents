name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BBMS_ENV: test
      DJANGO_SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (PEP 8, imports, bugbear)
        run: ruff check src
      - name: Format check
        run: ruff format --check src
      - name: Django system check
        run: python src/manage.py check
      - name: No missing migrations
        run: python src/manage.py makemigrations --check --dry-run
      - name: Tests with coverage (fails under 70 percent)
        run: |
          coverage run src/manage.py test src
          coverage report
